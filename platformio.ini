; ============================================================
; PlatformIO — Segurança Patrimonial
; ============================================================
; Uso (a partir da raiz do projeto):
;   pio run -e esp32dev          # firmware de produção (sketch.ino)
;   pio run -e esp32dev_teste    # firmware de teste do painel
;   pio run -t upload -e esp32dev
;   pio device monitor -e esp32dev
;
; O Arduino IDE e o Wokwi continuam usando sketch.ino /
; firmware_teste/ na raiz — o src_dir = "." evita duplicar fonte.
; ============================================================

[platformio]
default_envs = esp32dev
src_dir = .
include_dir = .

; ---------- Produção (FreeRTOS + OLED + sensores) ----------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_src_filter = +<sketch.ino>
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit SSD1306@^2.5.9
build_flags =
  -DCORE_DEBUG_LEVEL=1

; ---------- Teste do painel (só MQTT + botão/LED) ----------
[env:esp32dev_teste]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_src_filter = +<firmware_teste/firmware_teste.ino>
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5
build_flags =
  -DCORE_DEBUG_LEVEL=1
